server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache immutable hashed build assets aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app fallback: any unmatched route resolves to index.html
    # so client-side routing (if introduced later) still works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
