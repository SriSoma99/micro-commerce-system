name: CI

# Every push and pull request builds the services and runs the automated
# tests. The steps live in scripts/ci.sh so local runs and CI are identical.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            product-catalog-service/package-lock.json
            payment-simulator/package-lock.json
            testcase/package-lock.json
      # circuit-breaker.test.ts genuinely waits out the 15s resetTimeout.
      - run: bash scripts/ci.sh backend

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront-client/package-lock.json
      - run: bash scripts/ci.sh frontend

  # Images are only built once the tests above have passed, so a Docker image
  # is never produced from code that fails its checks.
  docker-images:
    name: Docker images build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
